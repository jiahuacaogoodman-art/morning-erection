# Virtual uv workspace root. The two distributions live in packages/*:
#   packages/wakecore             -> import `wakecore`             (kernel, stdlib only)
#   packages/wakecore-ui-runtime  -> import `wakecore_ui_runtime`  (browser sidecar, Playwright)
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
morning-erection = { workspace = true }
morning-erection-ui-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pgserver>=0.1.4; sys_platform != 'win32'",
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires WAKECORE_PG_DSN pointing at a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv*", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["wakecore", "wakecore_ui_runtime", "wakecore_example_plugin", "harness"]

[tool.ruff.lint.per-file-ignores]
"tests/real/conftest.py" = ["E402"]
